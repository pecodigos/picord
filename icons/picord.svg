<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#404EED"/>
    </linearGradient>
  </defs>
  <!-- Gamepad body -->
  <rect x="16" y="48" width="224" height="160" rx="80" ry="80" fill="url(#bg)"/>
  <!-- D-pad left -->
  <circle cx="72" cy="128" r="16" fill="rgba(255,255,255,0.25)"/>
  <circle cx="72" cy="128" r="8" fill="rgba(255,255,255,0.5)"/>
  <!-- Action button right -->
  <circle cx="184" cy="128" r="16" fill="rgba(255,255,255,0.25)"/>
  <circle cx="184" cy="128" r="8" fill="rgba(255,255,255,0.5)"/>
  <!-- P letter -->
  <text x="128" y="155" font-family="Segoe UI, Ubuntu, sans-serif" font-size="110" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>
</svg>
