name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Build binary
        run: go build -ldflags="-s -w" -o bin/picord ./cmd/picord
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: picord-binary
          path: bin/picord

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build release binary
        run: go build -ldflags="-s -w" -o bin/picord ./cmd/picord
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/picord
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
